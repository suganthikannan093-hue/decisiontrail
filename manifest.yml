# DecisionTrail - Forge manifest (app.id is filled in by `forge register`)
modules:
  jira:issuePanel:
    - key: decisiontrail-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      render: native
      title: Decisions
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  macro:
    - key: decisiontrail-decision-log
      resource: decision-log
      resolver:
        function: resolver
      render: native
      title: Decision log
      description: Live, filterable table of team decisions captured with DecisionTrail
      config:
        resource: decision-log-config
        render: native
  rovo:agent:
    - key: decisiontrail-agent
      name: DecisionTrail
      description: Captures team decisions from Jira and Confluence and explains why
        things were decided.
      prompt: >
        You are DecisionTrail, an assistant that helps teams record and recall
        decisions. When the user describes or points to a decision (what was
        chosen, why, which options were rejected), summarise it as a short
        title, a rationale and the options considered, confirm with the user,
        then call the save-decision action. When the user asks why something is
        the way it is, call find-decisions and answer citing decision ids and
        dates. Never invent decisions.
      conversationStarters:
        - Record the decision we just made on this issue
        - Why did we choose this approach?
        - List accepted decisions for this issue
      actions:
        - save-decision
        - find-decisions
  action:
    - key: save-decision
      name: Save decision
      function: save-decision-fn
      actionVerb: CREATE
      description: Save a structured team decision (title, rationale, options) and
        link it to the current Jira issue or Confluence page.
      inputs:
        title:
          title: Title
          type: string
          required: true
          description: One-line statement of what was decided
        rationale:
          title: Rationale
          type: string
          required: false
          description: Why it was decided, including trade-offs
        options:
          title: Options
          type: string
          required: false
          description: Comma-separated options that were considered
        status:
          title: Status
          type: string
          required: false
          description: proposed or accepted
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira issue key to link, if not the current issue
    - key: find-decisions
      name: Find decisions
      function: find-decisions-fn
      actionVerb: GET
      description: Search recorded decisions by text or by Jira issue key, returning
        status, date, id and rationale.
      inputs:
        query:
          title: Query
          type: string
          required: false
          description: Free-text search
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Only decisions linked to this issue
  function:
    - key: resolver
      handler: resolvers/index.handler
    - key: save-decision-fn
      handler: rovo/actions.saveDecision
    - key: find-decisions-fn
      handler: rovo/actions.findDecisions
resources:
  - key: issue-panel
    path: src/frontend/issuePanel.tsx
  - key: decision-log
    path: src/frontend/decisionLog.tsx
  - key: decision-log-config
    path: src/frontend/decisionLogConfig.tsx
app:
  runtime:
    name: nodejs22.x
  storage:
    entities:
      - name: decision
        attributes:
          id:
            type: string
          title:
            type: string
          rationale:
            type: string
          options:
            type: any
          status:
            type: string
          decidedBy:
            type: string
          date:
            type: string
          links:
            type: any
          supersedes:
            type: string
          supersededBy:
            type: string
          createdAt:
            type: string
          updatedAt:
            type: string
        indexes:
          - name: by-updated
            range:
              - updatedAt
          - name: by-status
            partition:
              - status
            range:
              - updatedAt
      - name: decisionlink
        attributes:
          decisionId:
            type: string
          target:
            type: string
        indexes:
          - name: by-target
            range:
              - target
  id: ari:cloud:ecosystem::app/c586bdf6-b73f-4665-9b80-a34d942d495c
permissions:
  scopes:
    - storage:app
    - read:jira-work
    - read:confluence-content.summary
