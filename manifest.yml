# DecisionTrail - Forge manifest (app.id is filled in by `forge register`)
modules:
  jira:issuePanel:
    - key: decisiontrail-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      render: native
      title: Decisions
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:entityProperty:
    - key: decisiontrail-issue-index
      entityType: issue
      propertyKey: decisiontrail
      values:
        - path: count
          type: number
          searchAlias: decisionCount
  macro:
    - key: decisiontrail-decision-log
      resource: decision-log
      resolver:
        function: resolver
      render: native
      title: Decision log
      description: Live, filterable table of team decisions captured with DecisionTrail
      config:
        resource: decision-log-config
        render: native
  rovo:agent:
    - key: decisiontrail-agent
      name: DecisionTrail Capture
      description: Reads an issue's or page's comment thread, proposes structured
        decisions and saves the ones you confirm.
      prompt: >
        You are DecisionTrail Capture. You turn discussion threads into recorded
        team decisions.

        1. When asked to capture or record decisions, call extract-decisions for
        the current Jira issue or Confluence page (or the key/id the user gives).

        2. From the thread and the candidate list it returns, propose each
        decision as: Title (one line, "Use X for Y"), Chosen option, Options
        considered, Rationale (the trade-offs, in the thread's own words),
        Owner, Date, Confidence, Sources (comment refs). Number them. Drop
        candidates the thread does not support; add any clear decision the
        heuristic missed, with its sources.

        3. Ask the user which to save, and whether each is Accepted or Proposed.
        Never save without explicit confirmation.

        4. For each confirmed decision call save-decision with title, rationale,
        options (comma separated), status, the issue key or page id, and
        sources (space separated refs). Then report the saved ids.

        Never invent decisions, owners or rationale that are not in the thread.
        To answer "why" questions, call explain-why and cite decision ids.
      conversationStarters:
        - Capture the decisions from this issue's comments
        - Record the decision we just made on this page
        - Why did we choose this approach?
      actions:
        - extract-decisions
        - save-decision
        - find-decisions
        - explain-why
    - key: decisiontrail-why-agent
      name: DecisionTrail Why
      description: Answers "why did we choose X?" from recorded decisions, with
        citations to the decision, its source comments and linked work.
      prompt: >
        You are DecisionTrail Why. For any question about why something was
        chosen, built or rejected, call explain-why with the question (and the
        issue key if one is in context). Answer in 2-4 sentences using only
        the returned facts. Cite each decision as [D1] with its id and date,
        then list the linked issues/pages and source comments as citations. If
        a decision was superseded, say what replaced it. If nothing is
        recorded, say so plainly and offer to capture it; never guess.
      conversationStarters:
        - Why are we using Kafka for order events?
        - What did we decide on this issue, and why?
        - Which decisions were reversed?
      actions:
        - explain-why
        - find-decisions
  action:
    - key: save-decision
      name: Save decision
      function: save-decision-fn
      actionVerb: CREATE
      description: Save a structured team decision (title, rationale, options) and
        link it to the current Jira issue or Confluence page.
      inputs:
        title:
          title: Title
          type: string
          required: true
          description: One-line statement of what was decided
        rationale:
          title: Rationale
          type: string
          required: false
          description: Why it was decided, including trade-offs
        options:
          title: Options
          type: string
          required: false
          description: Comma-separated options that were considered
        status:
          title: Status
          type: string
          required: false
          description: proposed or accepted
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira issue key to link, if not the current issue
        pageId:
          title: Page id
          type: string
          required: false
          description: Confluence page id to link, if not the current page
        sources:
          title: Sources
          type: string
          required: false
          description: Space-separated citation refs of the source comments, as
            returned by extract-decisions (e.g. jira:ACME-1#10001)
    - key: find-decisions
      name: Find decisions
      function: find-decisions-fn
      actionVerb: GET
      description: Search recorded decisions by text or by Jira issue key, returning
        status, date, id and rationale.
      inputs:
        query:
          title: Query
          type: string
          required: false
          description: Free-text search
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Only decisions linked to this issue
    - key: extract-decisions
      name: Extract decisions
      function: extract-decisions-fn
      actionVerb: GET
      description: Read the comment thread of a Jira issue or Confluence page and
        return it with candidate decisions (title, options, rationale, owner,
        date, confidence, source comment refs). Saves nothing.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira issue key; defaults to the issue in context
        pageId:
          title: Page id
          type: string
          required: false
          description: Confluence page id; defaults to the page in context
    - key: explain-why
      name: Explain why
      function: explain-why-fn
      actionVerb: GET
      description: Answer a "why did we choose X?" question from recorded
        decisions, returning rationale, options, status, supersession and
        citations (decision ids, linked issues/pages, source comments).
      inputs:
        question:
          title: Question
          type: string
          required: true
          description: The user's why-question, e.g. why are we on Kafka?
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Restrict to decisions linked to this Jira issue
  function:
    - key: resolver
      handler: resolvers/index.handler
    - key: save-decision-fn
      handler: rovo/actions.saveDecision
    - key: find-decisions-fn
      handler: rovo/actions.findDecisions
    - key: extract-decisions-fn
      handler: rovo/actions.extractDecisions
    - key: explain-why-fn
      handler: rovo/actions.explainWhy
resources:
  - key: issue-panel
    path: src/frontend/issuePanel.tsx
  - key: decision-log
    path: src/frontend/decisionLog.tsx
  - key: decision-log-config
    path: src/frontend/decisionLogConfig.tsx
app:
  runtime:
    name: nodejs22.x
  storage:
    entities:
      - name: decision
        attributes:
          id:
            type: string
          title:
            type: string
          rationale:
            type: string
          options:
            type: any
          status:
            type: string
          decidedBy:
            type: string
          date:
            type: string
          links:
            type: any
          supersedes:
            type: string
          supersededBy:
            type: string
          sources:
            type: any
          createdAt:
            type: string
          updatedAt:
            type: string
        indexes:
          - name: by-updated
            range:
              - updatedAt
          - name: by-status
            partition:
              - status
            range:
              - updatedAt
      - name: decisionlink
        attributes:
          decisionId:
            type: string
          target:
            type: string
        indexes:
          - name: by-target
            range:
              - target
  id: ari:cloud:ecosystem::app/c586bdf6-b73f-4665-9b80-a34d942d495c
permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:confluence-content.summary
    - read:page:confluence
    - read:comment:confluence
